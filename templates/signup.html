{% extends "base.html" %}
{% block content %}
<style>
/* Sign Up Page Styles - Blue Version */
body {
    background: linear-gradient(135deg, #4361ee 0%, #4cc9f0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.container {
    max-width: 100%;
    padding: 0;
}

.signup-container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.signup-header {
    background: linear-gradient(135deg, #4361ee, #3a0ca3);
    color: white;
    padding: 50px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.signup-header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 20px 20px;
    animation: float 20s linear infinite;
}

@keyframes float {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-20px, -20px) rotate(360deg); }
}

.signup-header h1 {
    margin: 0;
    font-size: 2.8rem;
    font-weight: 800;
    position: relative;
    z-index: 1;
}

.signup-header p {
    margin: 15px 0 0 0;
    opacity: 0.95;
    font-size: 1.2rem;
    font-weight: 500;
    position: relative;
    z-index: 1;
}

.signup-form {
    padding: 50px 40px;
    position: relative;
}

.form-group {
    margin-bottom: 25px;
    position: relative;
}

.form-group label {
    display: block;
    margin-bottom: 10px;
    color: #2d3748;
    font-weight: 600;
    font-size: 1.1rem;
}

.form-group input {
    width: 100%;
    padding: 16px 20px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 1.1rem;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    background: #f8fafc;
    font-weight: 500;
}

.form-group input:focus {
    outline: none;
    border-color: #4361ee;
    background: white;
    box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.15);
    transform: translateY(-2px);
}

.form-icon {
    position: absolute;
    right: 20px;
    top: 48px;
    color: #a0aec0;
    font-size: 1.2rem;
    transition: color 0.3s ease;
}

.form-group input:focus + .form-icon {
    color: #4361ee;
}

.signup-btn {
    width: 100%;
    background: linear-gradient(135deg, #4361ee, #3a0ca3);
    color: white;
    border: none;
    padding: 18px;
    border-radius: 12px;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    margin-top: 15px;
    box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
    position: relative;
    overflow: hidden;
}

.signup-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
}

.signup-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(67, 97, 238, 0.6);
}

.signup-btn:hover::before {
    left: 100%;
}

.signup-btn:active {
    transform: translateY(-1px);
}

.login-link {
    text-align: center;
    margin-top: 30px;
    color: #718096;
    font-size: 1.1rem;
    position: relative;
}

.login-link::before {
    content: '';
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
}

.login-link a {
    color: #4361ee;
    text-decoration: none;
    font-weight: 700;
    transition: all 0.3s ease;
    position: relative;
}

.login-link a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: #4361ee;
    transition: width 0.3s ease;
}

.login-link a:hover {
    color: #3a0ca3;
}

.login-link a:hover::after {
    width: 100%;
}

/* Animation for form elements */
.form-group {
    animation: slideInUp 0.6s ease;
}

.form-group:nth-child(1) { animation-delay: 0.1s; }
.form-group:nth-child(2) { animation-delay: 0.2s; }
.form-group:nth-child(3) { animation-delay: 0.3s; }
.form-group:nth-child(4) { animation-delay: 0.4s; }

@keyframes slideInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Password strength indicator */
.password-strength {
    margin-top: 8px;
    height: 4px;
    background: #e2e8f0;
    border-radius: 2px;
    overflow: hidden;
}

.strength-bar {
    height: 100%;
    width: 0%;
    transition: all 0.3s ease;
    border-radius: 2px;
}

.weak { background: #ef4444; width: 33%; }
.medium { background: #f59e0b; width: 66%; }
.strong { background: #10b981; width: 100%; }

/* Responsive Design */
@media (max-width: 600px) {
    body {
        padding: 15px;
    }
    
    .signup-container {
        max-width: 100%;
        margin: 10px;
    }
    
    .signup-header {
        padding: 40px 30px;
    }
    
    .signup-header h1 {
        font-size: 2.3rem;
    }
    
    .signup-form {
        padding: 40px 30px;
    }
    
    .form-group input {
        padding: 16px 18px;
    }
}

@media (max-width: 480px) {
    .signup-header {
        padding: 30px 25px;
    }
    
    .signup-header h1 {
        font-size: 2rem;
    }
    
    .signup-form {
        padding: 30px 25px;
    }
}
</style>

<div class="signup-container">
    <div class="signup-header">
        <h1>Join CareerMate</h1>
        <p>Start your career journey with us today</p>
    </div>
    
    <div class="signup-form">
        <form method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" name="name" type="text" placeholder="Enter your full name" required>
                <div class="form-icon">
                    <i class="fas fa-user"></i>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" placeholder="Enter your email address" required>
                <div class="form-icon">
                    <i class="fas fa-envelope"></i>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Create a password" required>
                <div class="form-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="password-strength">
                    <div class="strength-bar" id="password-strength-bar"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm your password" required>
                <div class="form-icon">
                    <i class="fas fa-lock"></i>
                </div>
            </div>
            
            <button type="submit" class="signup-btn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        
        <div class="login-link">
            <p>Already have an account? <a href="{{ url_for('login') }}">Sign in here</a></p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Add subtle animation to inputs on focus
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });
        
        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });

    // Password strength indicator
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('password-strength-bar');
    
    if (passwordInput && strengthBar) {
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            
            if (password.length >= 8) strength += 1;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength += 1;
            if (password.match(/\d/)) strength += 1;
            if (password.match(/[^a-zA-Z\d]/)) strength += 1;
            
            // Reset classes
            strengthBar.className = 'strength-bar';
            
            // Apply strength classes
            if (password.length > 0) {
                if (strength <= 1) {
                    strengthBar.classList.add('weak');
                } else if (strength <= 2) {
                    strengthBar.classList.add('medium');
                } else {
                    strengthBar.classList.add('strong');
                }
            }
        });
    }

    // Password confirmation check
    const confirmPasswordInput = document.getElementById('confirm_password');
    
    if (passwordInput && confirmPasswordInput) {
        confirmPasswordInput.addEventListener('input', function() {
            if (this.value !== passwordInput.value) {
                this.style.borderColor = '#ef4444';
            } else {
                this.style.borderColor = '#10b981';
            }
        });
    }
});
</script>
{% endblock %}
