{% extends "base.html" %}
{% block content %}
<style>
/* Alternative Login Page Styles - Blue Version */
body {
    background: linear-gradient(135deg, #4361ee 0%, #4cc9f0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.container {
    max-width: 100%;
    padding: 0;
}

.login-container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.login-header {
    background: linear-gradient(135deg, #4361ee, #3a0ca3);
    color: white;
    padding: 50px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.login-header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 20px 20px;
    animation: float 20s linear infinite;
}

@keyframes float {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-20px, -20px) rotate(360deg); }
}

.login-header h1 {
    margin: 0;
    font-size: 2.8rem;
    font-weight: 800;
    position: relative;
    z-index: 1;
}

.login-header p {
    margin: 15px 0 0 0;
    opacity: 0.95;
    font-size: 1.2rem;
    font-weight: 500;
    position: relative;
    z-index: 1;
}

.login-form {
    padding: 50px 40px;
    position: relative;
}

.form-group {
    margin-bottom: 30px;
    position: relative;
}

.form-group label {
    display: block;
    margin-bottom: 12px;
    color: #2d3748;
    font-weight: 600;
    font-size: 1.1rem;
}

.form-group input {
    width: 100%;
    padding: 18px 20px;
    border: 2px solid #e2e8f0;
    border-radius: 15px;
    font-size: 1.1rem;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    background: #f8fafc;
    font-weight: 500;
}

.form-group input:focus {
    outline: none;
    border-color: #4361ee;
    background: white;
    box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.15);
    transform: translateY(-2px);
}

.form-icon {
    position: absolute;
    right: 20px;
    top: 55px;
    color: #a0aec0;
    font-size: 1.2rem;
    transition: color 0.3s ease;
}

.form-group input:focus + .form-icon {
    color: #4361ee;
}

.login-btn {
    width: 100%;
    background: linear-gradient(135deg, #4361ee, #3a0ca3);
    color: white;
    border: none;
    padding: 18px;
    border-radius: 15px;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    margin-top: 15px;
    box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
    position: relative;
    overflow: hidden;
}

.login-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
}

.login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(67, 97, 238, 0.6);
}

.login-btn:hover::before {
    left: 100%;
}

.login-btn:active {
    transform: translateY(-1px);
}

.signup-link {
    text-align: center;
    margin-top: 35px;
    color: #718096;
    font-size: 1.1rem;
    position: relative;
}

.signup-link::before {
    content: '';
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
}

.signup-link a {
    color: #4361ee;
    text-decoration: none;
    font-weight: 700;
    transition: all 0.3s ease;
    position: relative;
}

.signup-link a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: #4361ee;
    transition: width 0.3s ease;
}

.signup-link a:hover {
    color: #3a0ca3;
}

.signup-link a:hover::after {
    width: 100%;
}

.company-login-link {
    text-align: center;
    margin-top: 25px;
    color: #718096;
    font-size: 1.1rem;
    position: relative;
}

.company-login-link::before {
    content: '';
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
}

.company-login-link a {
    color: #10b981;
    text-decoration: none;
    font-weight: 700;
    transition: all 0.3s ease;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.company-login-link a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: #10b981;
    transition: width 0.3s ease;
}

.company-login-link a:hover {
    color: #059669;
}

.company-login-link a:hover::after {
    width: 100%;
}

.home-link {
    text-align: center;
    margin-top: 25px;
    color: #718096;
    font-size: 1.1rem;
    position: relative;
}

.home-link::before {
    content: '';
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 40%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
}

.home-link a {
    color: #f59e0b;
    text-decoration: none;
    font-weight: 700;
    transition: all 0.3s ease;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.home-link a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: #f59e0b;
    transition: width 0.3s ease;
}

.home-link a:hover {
    color: #d97706;
}

.home-link a:hover::after {
    width: 100%;
}

/* Animation for form elements */
.form-group {
    animation: slideInUp 0.6s ease;
}

.form-group:nth-child(1) { animation-delay: 0.1s; }
.form-group:nth-child(2) { animation-delay: 0.2s; }

@keyframes slideInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive Design */
@media (max-width: 600px) {
    body {
        padding: 15px;
    }
    
    .login-container {
        max-width: 100%;
        margin: 10px;
    }
    
    .login-header {
        padding: 40px 30px;
    }
    
    .login-header h1 {
        font-size: 2.3rem;
    }
    
    .login-form {
        padding: 40px 30px;
    }
    
    .form-group input {
        padding: 16px 18px;
    }
}

@media (max-width: 480px) {
    .login-header {
        padding: 30px 25px;
    }
    
    .login-header h1 {
        font-size: 2rem;
    }
    
    .login-form {
        padding: 30px 25px;
    }
}
</style>

<div class="login-container">
    <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Continue your career journey with CareerMate</p>
    </div>
    
    <div class="login-form">
        <form method="post">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" placeholder="Enter your email address" required>
                <div class="form-icon">
                    <i class="fas fa-envelope"></i>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required>
                <div class="form-icon">
                    <i class="fas fa-lock"></i>
                </div>
            </div>
            
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In to CareerMate
            </button>
        </form>
        
        <div class="signup-link">
            <p>New to CareerMate? <a href="{{ url_for('signup') }}">Create an account</a></p>
        </div>

        <div class="company-login-link">
            <p>Are you a company? <a href="{{ url_for('company_login') }}">
                <i class="fas fa-building"></i> Company Login
            </a></p>
        </div>

        <div class="home-link">
            <p><a href="{{ url_for('home') }}">
                <i class="fas fa-home"></i> Back to Home Page
            </a></p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Add subtle animation to inputs on focus
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });
        
        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });
});
</script>
{% endblock %}
